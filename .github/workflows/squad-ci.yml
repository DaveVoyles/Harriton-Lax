name: Squad CI

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  test:
    # Stays on ubuntu-latest: this job runs `node --test` directly against
    # PR-branch test files, and this repo is public with an unfiltered
    # pull_request trigger -- on self-hosted, a fork PR's own test file
    # content would execute on personal infrastructure. No cost benefit to
    # self-hosting here anyway: public repos get unlimited free GitHub-hosted
    # Actions minutes, so this was never actually saving anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test test/*.test.js
