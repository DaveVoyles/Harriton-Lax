# CodeRabbit AI review config — https://docs.coderabbit.ai/guides/configure-coderabbit
# This repo is mostly markdown playbook content. Only the tooling dirs get reviewed,
# so CodeRabbit stays quiet on coaching material and speaks up on scripts.
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: true

  in_progress_fortune: false   # no "fortune cookie" filler comment while it works
  sequence_diagrams: true      # diagrams in the walkthrough
  slop_detection:
    enabled: true              # flags low-effort / AI-slop PRs (free on public repos)

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # Playbook content is prose, not code — exclude it.
  path_filters:
    - "!defense/**"
    - "!offense/**"
    - "!plays/**"
    - "!drills/**"
    - "!faceoffs/**"
    - "!game-plans/**"
    - "!practice-plans/**"
    - "!rides-and-clears/**"
    - "!**/*.lock"

  tools:
    github-checks:
      enabled: true

chat:
  auto_reply: true
